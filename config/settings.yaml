# 论文评审系统配置文件（非敏感配置）
# API密钥和路径等请通过 .env 文件配置

# 分数范围（默认 60-89）
score_range:
  min: 60
  max: 89

# AI评审参数
ai_evaluation:
  temperature: 0.3
  max_tokens: 4096
  request_delay: 1.0  # 每次API请求间隔（秒）

# AIGC检测配置
aigc_detection:
  enabled: true
  threshold: 0.7

# 查重配置
plagiarism:
  enabled: true
  suspect_threshold: 0.4         # 疑似阈值
  high_threshold: 0.6            # 高度疑似阈值
  min_match_length: 30           # 最小匹配长度（字符）
  char_ngram_size: 8             # 字符 n-gram 大小
  word_ngram_size: 3             # 词级 n-gram 大小
  minhash_hashes: 128            # MinHash 签名数
  ai_check: true                 # 是否启用 AI 辅助判断

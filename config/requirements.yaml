evaluation_criteria: 基于SSM框架的Web项目，重点考察功能完整性、代码规范性和文档质量
dimensions:
- name: 功能实现
  weight: 0.35
  description: 评审要点：核心功能（增删改查、用户登录、权限控制）是否完整实现，功能逻辑是否正确，是否满足题目基本要求。扣分情形：缺少核心功能模块（如缺少删除功能、登录功能未实现）、功能存在明显bug、权限控制混乱。优秀标准：所有基本功能完整实现且运行稳定，功能逻辑清晰正确，用户体验良好，有合理的错误处理和输入验证。
- name: 技术运用
  weight: 0.25
  description: 评审要点：SSM框架（Spring MVC、Spring、MyBatis）是否正确运用，MVC分层架构是否清晰，数据库设计是否合理，前端技术是否恰当使用。扣分情形：未使用指定框架、分层架构混乱（如Controller直接操作数据库）、数据库表设计存在明显问题（如缺少必要字段、无关联关系）。优秀标准：框架运用规范，三层架构清晰，数据库表结构设计合理，前后端交互规范。
- name: 代码质量
  weight: 0.2
  description: 评审要点：代码结构是否清晰，命名是否规范，是否有适当注释，代码是否遵循Java编码规范，是否存在冗余代码。扣分情形：代码结构混乱、命名不规范（如使用拼音或无意义变量名）、无注释或注释与代码不符、存在大量重复代码。优秀标准：代码结构清晰，包结构合理，命名规范统一，关键逻辑有清晰注释，代码简洁无冗余。
- name: 文档规范
  weight: 0.15
  description: 评审要点：报告结构是否完整，各章节内容是否充实，格式是否规范，截图是否清晰有效，问题分析是否深入。扣分情形：缺少必要章节、内容过于简略（如某章节仅几句话）、格式混乱、截图模糊或无标注。优秀标准：报告结构完整，各章节内容充实具体，格式规范统一，截图清晰且有标注说明，问题分析有深度。
- name: 创新拓展
  weight: 0.05
  description: 评审要点：是否有超出基本要求的额外功能，是否有技术创新或优化，是否有独特的解决方案。扣分情形：无拓展（此项不扣分，仅作为加分项）。优秀标准：实现了额外的高级功能（如分页查询、搜索高亮、数据导出等），或对系统进行了性能优化、安全防护等。
completeness:
  sections_weight: 40
  sections:
  - name: 功能实现
    patterns:
    - 功能实现|功能描述|系统功能
    - 主要功能|功能模块
    weight: 10
  - name: 代码实现
    patterns:
    - 代码实现|核心代码|关键代码
    - 代码片段|代码说明
    weight: 8
  - name: 项目演示截图
    patterns:
    - 项目演示截图|运行界面|页面截图
    - 系统截图|界面展示
    weight: 7
  - name: 遇到的问题与解决方案
    patterns:
    - 遇到的问题与解决方案|问题与解决
    - 问题分析|解决方案
    weight: 6
  - name: 项目结构
    patterns:
    - 项目结构|目录结构
    - 项目目录|文件结构
    weight: 4
  - name: 技术栈
    patterns:
    - 技术栈|开发环境|技术选型
    - 技术说明|开发工具
    weight: 3
  - name: 项目概述
    patterns:
    - 项目概述|项目背景|项目简介
    - 项目描述|项目概况
    weight: 1
  - name: 总结与展望
    patterns:
    - 总结与展望|总结|项目总结
    - 心得体会|未来展望
    weight: 1
  word_count:
    min: 2500
    weight: 25
  figures:
    min: 3
    weight: 15
  format:
    min_paragraphs: 15
    max_long_line_ratio: 0.2
    weight: 20
  word_count_weight: 30
  figures_weight: 15
  format_weight: 15

evaluation_criteria: 本报告旨在全面评估学生对Hadoop生态架构设计的理解深度，重点考察分布式存储与计算原理的掌握程度、架构设计逻辑的合理性以及文档的规范完整性。
dimensions:
- name: 架构设计
  weight: 0.35
  description: 评审要点：考察HDFS存储机制、MapReduce计算逻辑及YARN调度原理的阐述是否准确。扣分情形：若仅罗列组件名称而未解释底层交互逻辑，或MapReduce键值对设计错误，酌情扣分。优秀标准：能清晰推演数据从采集到计算落盘的全链路，准确描述Block切分、Shuffle过程及Container资源分配机制，逻辑严密。
- name: 技术选型
  weight: 0.25
  description: 评审要点：考察Flume Source/Sink/Channel选型及多副本机制等关键技术选型的合理性论证。扣分情形：技术选型未说明理由（如为何选Memory
    Channel而非File Channel），或选型与场景不匹配，酌情扣分。优秀标准：能结合金融数据高可靠、高吞吐的需求，详细对比不同组件特性并给出具有说服力的选型依据。
- name: 痛点分析
  weight: 0.2
  description: 评审要点：考察对单机架构局限性的剖析深度，以及分布式架构优势的理解。扣分情形：痛点描述过于笼统，未结合TB级金融数据的具体场景（如I/O瓶颈、OOM风险），酌情扣分。优秀标准：能具体量化单机在处理海量历史行情数据时的存储与算力瓶颈，并与分布式方案形成鲜明对比。
- name: 文档规范
  weight: 0.1
  description: 评审要点：考察报告结构的完整性、图表的清晰度及排版的规范性。扣分情形：章节缺失、字数严重不足、图表模糊不清或排版混乱，酌情扣分。优秀标准：严格遵循给定的五章结构，字数达标，包含清晰的数据流转图或架构图，排版美观易读。
- name: 创新拓展
  weight: 0.1
  description: 评审要点：考察对Hive、Spark等扩展技术的展望及独立思考能力。扣分情形：无总结展望或仅简单重复正文内容，酌情扣分。优秀标准：能基于当前Hadoop架构提出切实可行的性能优化方向（如引入Spark内存计算加速迭代查询），见解独到。

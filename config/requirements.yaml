evaluation_criteria: 本评审方案侧重于Web项目核心功能的完整实现、技术栈的正确应用以及课程报告的规范性与完整性，旨在评估学生的工程实践能力与文档撰写水平。
dimensions:
- name: 功能实现
  weight: 0.35
  description: 评审要点：系统是否完整实现了题目要求的基本功能（如增删改查、登录验证、权限控制等），业务流程是否通畅，数据交互是否正确。扣分情形：核心功能缺失（如无法登录、无法保存数据）、业务逻辑错误（如权限越权、数据不一致）、界面交互严重受阻。优秀标准：所有规定功能均能稳定运行，无重大Bug；用户操作流程符合直觉，异常处理得当（如输入非法数据有提示）；若有多余功能（如搜索优化、状态管理），逻辑严密且实现完美，可酌情加分。
- name: 技术规范
  weight: 0.25
  description: 评审要点：是否严格使用指定的技术栈（Spring MVC/Spring/MyBatis, MySQL, HTML/CSS/JS）；代码结构是否符合MVC分层规范；数据库设计是否合理（范式、索引）；Git版本控制记录是否清晰。扣分情形：未使用指定框架或数据库、代码耦合度高、数据库表设计存在严重冗余或主键缺失、无Git提交记录或记录混乱。优秀标准：代码分层清晰，命名规范，注释适量且准确；数据库设计符合第三范式，关键查询有索引优化；Git提交历史完整，反映了开发过程；前端页面布局整洁，响应式适配良好。
- name: 文档质量
  weight: 0.2
  description: 评审要点：报告结构是否完整，涵盖概述、功能、技术、结构、代码、截图、问题、总结等章节；文字表达是否通顺、专业；截图是否清晰且与文字描述对应。扣分情形：缺少必要章节、截图模糊或无法展示功能、文字抄袭或过于简略、排版混乱。优秀标准：报告逻辑严密，图文并茂，截图清晰标注了关键操作或结果；对核心代码有深入解析，不仅罗列代码更解释原理；‘问题与解决’部分真实反映了开发难点及思考过程，而非泛泛而谈。
- name: 工程素养
  weight: 0.2
  description: 评审要点：项目是否可独立运行（提供启动说明或截图）；代码是否具备基本的健壮性；是否体现了良好的编程习惯（如异常捕获、资源关闭）。扣分情形：项目无法启动、缺少配置文件说明、代码存在明显的内存泄漏风险或资源未关闭、无异常处理机制。优秀标准：提供清晰的运行环境说明和启动步骤；代码具备完善的异常处理机制，对潜在错误有预判和处理；前端页面美观度较高，用户体验良好；整体工程化程度高，接近小型企业级项目标准。
completeness:
  sections_weight: 40
  sections:
  - name: 功能实现
    patterns:
    - 功能实现|功能描述|系统功能
    - 主要功能|功能模块|业务功能
    weight: 8
  - name: 代码实现
    patterns:
    - 代码实现|核心代码|关键代码
    - 代码片段|实现原理|源码分析
    weight: 8
  - name: 演示截图
    patterns:
    - 项目演示截图|运行截图|界面展示
    - 系统截图|功能截图|页面展示
    weight: 6
  - name: 问题与解决
    patterns:
    - 遇到的问题与解决方案|问题与解决
    - 开发难点|故障排查|解决方案
    weight: 5
  - name: 技术栈
    patterns:
    - 技术栈|开发环境|技术选型
    - 使用的技术|技术框架
    weight: 4
  - name: 项目结构
    patterns:
    - 项目结构|目录结构|工程结构
    - 文件结构|模块划分
    weight: 4
  - name: 项目概述
    patterns:
    - 项目概述|项目背景|项目简介
    - 项目描述|项目概况|引言
    weight: 3
  - name: 总结与展望
    patterns:
    - 总结与展望|总结|心得体会
    - 不足与改进|未来计划
    weight: 2
  word_count:
    min: 2500
    weight: 25
  figures:
    min: 3
    weight: 15
  format:
    min_paragraphs: 15
    max_long_line_ratio: 0.2
    weight: 10
  word_count_weight: 30
  figures_weight: 15
  format_weight: 15

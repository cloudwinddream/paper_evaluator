evaluation_criteria: 以Hadoop生态全链路功能实现为核心，重点考察数据采集→清洗→分析→可视化的闭环完成度，辅以排错真实性和文档规范性进行综合评分。
dimensions:
- name: 功能实现
  weight: 0.35
  description: 评审要点：完整覆盖Flume日志采集、HDFS分布式存储、MapReduce脏数据清洗、Hive数仓建模与SQL指标计算（PV/UV/Top10）、数据可视化图表共五大核心环节。扣分情形：缺少任一环节扣5-8分；数据未使用学号种子生成或数据量明显不足2GB扣5分；HiveQL未正确实现COUNT(DISTINCT)去重或Top10缺少ORDER
    BY LIMIT逻辑扣3-5分；可视化图表不足2张扣3分。优秀标准：五大环节全部完整实现，数据量达标且链路清晰，PV/UV/Top10三项指标计算结果正确，可视化图表美观且具有商业分析深度。
- name: 代码与配置
  weight: 0.25
  description: 评审要点：Flume配置文件（flume.conf）参数完整且含中文注释；MapReduce Mapper类源码含防御性过滤逻辑注释；Hive外部表DDL含FIELDS
    TERMINATED BY和LOCATION定义；HiveQL语句语法正确。扣分情形：代码块缺失每处扣3分；代码无注释或注释为敷衍性文字扣2分；配置参数错误或路径不一致扣2分；直接抄袭通用模板代码无明显个人定制扣3-5分。优秀标准：所有代码块完整粘贴，关键逻辑含详细中文注释，配置参数与实际运行环境完全一致，代码体现个人独立编写痕迹。
- name: 排错实录
  weight: 0.2
  description: 评审要点：必须包含至少2个真实排错记录，每项需含报错截图/日志文本、排查思路、最终解决方案三要素。扣分情形：缺少排错记录每项扣5分；报错日志为伪造或从网络直接复制扣5-8分；排查思路空洞无物（如仅写'重启就好了'）扣3分；解决方案与报错不对应扣3分。优秀标准：报错真实可复现，排查过程体现查看日志→定位参数/代码→验证修复的完整思维链，解决方案具体到修改某行配置或某行代码，展现真实的调试能力。
- name: 文档规范
  weight: 0.12
  description: 评审要点：严格按7章标准模板结构撰写，各章节指定粘贴位置均有内容填充，图文排版整洁。扣分情形：章节缺失每章扣3分；标注【此处粘贴截图】或【此处粘贴代码】位置为空每处扣2分；全文少于2000字扣3分；段落结构混乱或超长代码行占比超20%扣2分。优秀标准：7章结构完整无缺，所有标注位置均有对应内容，总字数2500字以上，图文比例协调，排版清晰易读。
- name: 商业分析
  weight: 0.08
  description: 评审要点：第五章商业价值分析需站在数据运营视角，结合可视化图表提出针对性策略，字数约300字。扣分情形：分析内容缺失扣5分；仅描述图表数据而无策略建议扣3分；字数不足150字扣2分；分析内容与电商业务场景无关扣2分。优秀标准：能准确解读漏斗转化率、购买转化异常等数据表现，提出满减促销、催付提醒、购物车优化等可落地的运营策略，体现数据驱动决策思维。
